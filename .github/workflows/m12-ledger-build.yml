name: M12 Ledger Build
on:
  push:
    branches: [dna-m12-asset-policy]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-m12-asset-policy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate canonical policy and generate 271-entry ledger
        shell: python
        run: |
          import json
          from pathlib import Path
          from design_dna.asset_policy import asset_policy_ledger_payload

          payload = asset_policy_ledger_payload()
          assert payload['unit_count'] == 271
          assert payload['asset_applicable_count'] == 207
          assert payload['asset_not_applicable_count'] == 64
          assert payload['direct_ip_gated_count'] == 75
          assert payload['final_approved_count'] == 0
          path = Path('docs/design-dna/migration/status/ASSET_POLICY_271.json')
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
      - name: Commit canonical ledger snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/design-dna/migration/status/ASSET_POLICY_271.json
          git commit -m 'docs(dna): add canonical 271-entry M12 asset ledger'
          git push origin HEAD:dna-m12-asset-policy
