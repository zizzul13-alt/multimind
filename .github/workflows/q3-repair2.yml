name: Q3 Repair 2
on:
  push:
    branches: [dna-q3-closure]
    paths: [.github/workflows/q3-repair2.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: dna-q3-closure}
      - shell: python
        run: |
          from pathlib import Path
          p=Path('tests/test_design_dna_quarantine_boundary.py'); t=p.read_text()
          old='assert "quarantine_next_gate: Q3_THEME_BRIDGE_DECOUPLING" in text'
          new='assert "quarantine_next_gate: Q4_PRIVATE_REPOSITORY_CUT" in text'
          if old not in t: raise SystemExit('stale quarantine assertion not found')
          p.write_text(t.replace(old,new))
          Path('.github/workflows/q3-repair2.yml').unlink()
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_design_dna_quarantine_boundary.py .github/workflows/q3-repair2.yml
          git commit -m "test(dna): advance quarantine-next lifecycle assertion"
          git push
