name: Q4 Closure Guard Repair
on:
  push:
    branches: [dna-q4-closure]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-q4-closure
      - name: Advance Q4 inventory lifecycle assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/test_design_dna_q4_private_ready.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "q4_state: PRIVATE_READY_CANDIDATE_AWAITING_GOVERNOR_ACC" in text\n'
          new = (
            '    assert "q4_state: PRIVATE_READY" in text\n'
            '    assert "q4_state: PRIVATE_READY_CANDIDATE_AWAITING_GOVERNOR_ACC" not in text\n'
          )
          if old not in text:
              raise SystemExit('stale candidate-state assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit closure guard repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_design_dna_q4_private_ready.py
          git commit -m 'test(dna): advance Q4 inventory to private-ready'
          git push origin HEAD:dna-q4-closure
