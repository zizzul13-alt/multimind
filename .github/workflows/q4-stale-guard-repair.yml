name: Q4 Stale Guard Repair
on:
  push:
    branches: [dna-q4-private-ready]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-q4-private-ready
      - name: Repair stale Q2-to-Q4 assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/test_design_dna_quarantine_boundary.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "NON_RESOLVER_INTERNAL_LEGACY_SELF_IMPORTS_STILL_ROUTE_THROUGH_UI_DNA_SHIMS_UNTIL_Q4" in text\n'
          new = (
              '    assert "RESOLVED_AT_Q4_PRIVATE_READY_CUT__NO_INTERNAL_REVERSE_IMPORT_THROUGH_UI_DNA_OR_UI_THEME_STUDIO_SHIMS" in text\n'
              '    assert "NON_RESOLVER_INTERNAL_LEGACY_SELF_IMPORTS_STILL_ROUTE_THROUGH_UI_DNA_SHIMS_UNTIL_Q4" not in text\n'
          )
          if old not in text:
              raise SystemExit('stale Q2 debt assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit guard repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_design_dna_quarantine_boundary.py
          git commit -m 'test(dna): advance Q4 reverse-import lifecycle guard'
          git push origin HEAD:dna-q4-private-ready
