name: Q3 Repair
on:
  push:
    branches: [dna-q3-closure]
    paths: [.github/workflows/q3-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: dna-q3-closure}
      - shell: python
        run: |
          from pathlib import Path
          p=Path('tests/test_design_dna_quarantine_boundary.py')
          t=p.read_text(encoding='utf-8')
          old='assert f"authoritative_main_at_update: {M10_INTEGRATION_COMMIT}" in text'
          new='assert f"authoritative_main_at_update: {Q3_INTEGRATION_COMMIT}" in text'
          if old not in t: raise SystemExit('stale assertion not found')
          p.write_text(t.replace(old,new),encoding='utf-8')
          Path('.github/workflows/q3-repair.yml').unlink()
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_design_dna_quarantine_boundary.py .github/workflows/q3-repair.yml
          git commit -m "test(dna): repair stale Q3 lifecycle assertion"
          git push
