name: M3 Targeted Verification

on:
  push:
    branches: [design-dna-m3-tier-s]

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: M3 focused + compatibility
        run: python -m pytest tests/test_design_dna_m3_tier_s.py tests/test_design_dna_m3_registration_surface.py tests/test_design_dna_m2_proving_slice.py tests/test_design_dna_m1_engines.py tests/test_design_dna_m0_runtime.py -q
      - name: Dependency sanity
        run: pip check
