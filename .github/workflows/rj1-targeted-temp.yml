name: RJ1 Targeted Verification

on:
  push:
    branches: [rj1-portability-application-boundary]

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: RJ-1 targeted pytest
        run: python -m pytest tests/test_rj1_portability_boundary.py tests/test_application_boundary.py tests/test_restore_application_boundary.py tests/test_s1_identity_storage_isolation.py -q
      - name: Dependency sanity
        run: pip check
