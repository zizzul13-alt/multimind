name: M11 Closure Apply
on:
  push:
    branches: [dna-m11-closure]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-m11-closure
      - name: Apply M11 lifecycle state
        shell: python
        run: |
          from pathlib import Path

          status_path = Path('docs/design-dna/migration/status/MIGRATION_STATUS.yaml')
          text = status_path.read_text(encoding='utf-8')
          replacements = {
              'authoritative_main_at_update: 69e01db253d9a143a65da03399b6354ad79e3313': 'authoritative_main_at_update: 40fd49967d9eebe289087d494174f1b13651df3f',
              '  current_closed_batch: M10\n  next_eligible_batch: M11\n  quarantine_next_gate: Q4_PRIVATE_REPOSITORY_CUT': '  current_closed_batch: M11\n  next_eligible_batch: M12_AFTER_Q4\n  quarantine_next_gate: Q4_PRIVATE_REPOSITORY_CUT',
              '''  M11:\n    governor_status: NOT_STARTED\n    accepted: false\n    closed: false\n    integrated: false\n    scope_summary: FIXTURES_14\n    eq4_credit: 0''': '''  M11:\n    governor_status: ACC_CLOSED_INTEGRATED\n    accepted: true\n    closed: true\n    integrated: true\n    integration_commit: 40fd49967d9eebe289087d494174f1b13651df3f\n    pull_request: 86\n    manifest: docs/design-dna/migration/status/M11_ACC.yaml\n    implementation_report: docs/design-dna/migration/M11_IMPLEMENTATION_REPORT.md\n    scope_summary: FIXTURES_14\n    clean_head_tests: 37767\n    clean_head_ci_run: 120\n    exact_main_tests: 37767\n    exact_main_ci_run: 121\n    runtime_census_total: 271\n    eq4_credit: 0''',
              '''next_action:\n  gate: M11_FIXTURES_14\n  then_gate: Q4_PRIVATE_REPOSITORY_CUT\n  authorized_by_user_sequence: true\n  instruction: EXECUTE_M11_DURABLY_THEN_Q4_WITHOUT_SKIPPING_PROOF''': '''next_action:\n  gate: Q4_PRIVATE_REPOSITORY_CUT\n  then_gate: M12_FINAL_ASSET_POLICY_RECONCILIATION\n  authorized_by_user_sequence: true\n  instruction: EXECUTE_Q4_DURABLY_THEN_M12_WITHOUT_SKIPPING_PROOF''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected status pattern: {old[:80]!r}')
              text = text.replace(old, new, 1)
          status_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_design_dna_quarantine_boundary.py')
          text = test_path.read_text(encoding='utf-8')
          old = 'Q3_ACC_PATH = "docs/design-dna/quarantine/Q3_ACC.yaml"\nMIGRATION_STATUS_PATH'
          new = 'Q3_ACC_PATH = "docs/design-dna/quarantine/Q3_ACC.yaml"\nM11_INTEGRATION_COMMIT = "40fd49967d9eebe289087d494174f1b13651df3f"\nM11_ACC_PATH = "docs/design-dna/migration/status/M11_ACC.yaml"\nMIGRATION_STATUS_PATH'
          if old not in text:
              raise SystemExit('missing Q3 constant seam')
          text = text.replace(old, new, 1)
          replacements = {
              'assert f"authoritative_main_at_update: {Q3_INTEGRATION_COMMIT}" in text': 'assert f"authoritative_main_at_update: {M11_INTEGRATION_COMMIT}" in text',
              'assert "current_closed_batch: M10" in text': 'assert "current_closed_batch: M11" in text',
              'assert "next_eligible_batch: M11" in text': 'assert "next_eligible_batch: M12_AFTER_Q4" in text',
              'assert "gate: M11_FIXTURES_14" in text': 'assert "M11:\\n    governor_status: ACC_CLOSED_INTEGRATED" in text\n    assert f"integration_commit: {M11_INTEGRATION_COMMIT}" in text\n    assert f"manifest: {M11_ACC_PATH}" in text\n    assert "exact_main_tests: 37767" in text\n    assert "exact_main_ci_run: 121" in text\n    assert "gate: Q4_PRIVATE_REPOSITORY_CUT" in text',
              'assert "then_gate: Q4_PRIVATE_REPOSITORY_CUT" in text': 'assert "then_gate: M12_FINAL_ASSET_POLICY_RECONCILIATION" in text',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected test pattern: {old!r}')
              text = text.replace(old, new, 1)
          test_path.write_text(text, encoding='utf-8')
      - name: Commit closure state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/design-dna/migration/status/MIGRATION_STATUS.yaml tests/test_design_dna_quarantine_boundary.py
          git commit -m 'docs(dna): durably close M11 fixtures'
          git push origin HEAD:dna-m11-closure
