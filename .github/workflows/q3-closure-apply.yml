name: Q3 Closure Apply
on:
  push:
    branches: [dna-q3-closure]
    paths: [.github/workflows/q3-closure-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-q3-closure
      - name: Apply Q3 durable closure state
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path); text = p.read_text(encoding="utf-8")
              if old not in text: raise SystemExit(f"missing expected text in {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace("docs/design-dna/quarantine/DNA_QUARANTINE_MANIFEST.yaml",
                  "  Q3_theme_bridge_decoupling:\n    status: NOT_STARTED\n    strategy: REDUCE_APP_AND_UI_THEMES_TO_SMALL_INTERFACE_AND_SAFE_DEFAULT_FALLBACK",
                  "  Q3_theme_bridge_decoupling:\n    status: DURABLE_CLOSED\n    accepted: true\n    integration_commit: 69e01db253d9a143a65da03399b6354ad79e3313\n    pull_request: 84\n    acc_manifest: docs/design-dna/quarantine/Q3_ACC.yaml\n    public_bridge: ui/dna_bridge.py\n    strategy: REDUCE_APP_AND_UI_THEMES_TO_SMALL_INTERFACE_AND_SAFE_DEFAULT_FALLBACK\n    evidence:\n      clean_head: 37551_PASS_RUN_110\n      post_merge_exact_main: 37551_PASS_RUN_111\n      pip_check: CLEAN\n      public_safe_fallback: PASS")
          replace("docs/design-dna/migration/status/MIGRATION_STATUS.yaml",
                  "authoritative_main_at_update: 40d4fd8a58a4d8cb4a2f29d89944cfbe1d0ed4cc",
                  "authoritative_main_at_update: 69e01db253d9a143a65da03399b6354ad79e3313")
          replace("docs/design-dna/migration/status/MIGRATION_STATUS.yaml",
                  "  quarantine_next_gate: Q3_THEME_BRIDGE_DECOUPLING",
                  "  quarantine_next_gate: Q4_PRIVATE_REPOSITORY_CUT")
          replace("docs/design-dna/migration/status/MIGRATION_STATUS.yaml",
                  "  Q3:\n    status: NOT_STARTED\n    required_before_batch: M11",
                  "  Q3:\n    status: DURABLE_CLOSED\n    integration_commit: 69e01db253d9a143a65da03399b6354ad79e3313\n    pull_request: 84\n    acc_manifest: docs/design-dna/quarantine/Q3_ACC.yaml\n    exact_main_tests: 37551\n    exact_main_ci_run: 111\n    required_before_batch: M11")
          replace("docs/design-dna/migration/status/MIGRATION_STATUS.yaml",
                  "next_action:\n  gate: Q3_THEME_BRIDGE_DECOUPLING\n  then_gate: M11_FIXTURES_14\n  authorized_by_user_sequence: true\n  instruction: EXECUTE_Q3_DURABLY_THEN_M11_WITHOUT_SKIPPING_PROOF",
                  "next_action:\n  gate: M11_FIXTURES_14\n  then_gate: Q4_PRIVATE_REPOSITORY_CUT\n  authorized_by_user_sequence: true\n  instruction: EXECUTE_M11_DURABLY_THEN_Q4_WITHOUT_SKIPPING_PROOF")

          p = Path("tests/test_design_dna_quarantine_boundary.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace('MIGRATION_STATUS_PATH = "docs/design-dna/migration/status/MIGRATION_STATUS.yaml"', 'Q3_INTEGRATION_COMMIT = "69e01db253d9a143a65da03399b6354ad79e3313"\nQ3_ACC_PATH = "docs/design-dna/quarantine/Q3_ACC.yaml"\nMIGRATION_STATUS_PATH = "docs/design-dna/migration/status/MIGRATION_STATUS.yaml"')
          text = text.replace('    assert "gate: Q3_THEME_BRIDGE_DECOUPLING" in text\n    assert "then_gate: M11_FIXTURES_14" in text', '    assert "Q3:\\n    status: DURABLE_CLOSED" in text\n    assert f"integration_commit: {Q3_INTEGRATION_COMMIT}" in text\n    assert f"acc_manifest: {Q3_ACC_PATH}" in text\n    assert "exact_main_tests: 37551" in text\n    assert "exact_main_ci_run: 111" in text\n    assert "gate: M11_FIXTURES_14" in text\n    assert "then_gate: Q4_PRIVATE_REPOSITORY_CUT" in text')
          p.write_text(text, encoding="utf-8")
          Path(".github/workflows/q3-closure-apply.yml").unlink()
      - name: Commit closure ledger
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/design-dna/quarantine/DNA_QUARANTINE_MANIFEST.yaml docs/design-dna/migration/status/MIGRATION_STATUS.yaml tests/test_design_dna_quarantine_boundary.py .github/workflows/q3-closure-apply.yml
          git commit -m "docs(dna): durably close Q3 public bridge"
          git push
