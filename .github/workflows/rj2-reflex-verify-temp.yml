name: RJ2 Reflex Verification

on:
  push:
    branches: [rj2-reflex-production-host]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: RJ-2 targeted pytest
        run: python -m pytest tests/test_rj2_reflex_production_host.py -q
      - name: Reflex app import
        run: python -c "from multimind_reflex.multimind_reflex import app; print(type(app).__name__)"
      - name: Reflex dry compile
        run: reflex compile --dry --no-rich
      - name: Full pytest regression
        run: python -m pytest -q
      - name: Dependency sanity
        run: pip check
