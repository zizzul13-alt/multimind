name: RJ1 Temporary Verification

on:
  push:
    branches:
      - rj1-portability-application-boundary

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: RJ-1 focused tests
        run: python -m pytest tests/test_rj1_portability_boundary.py tests/test_application_boundary.py tests/test_restore_application_boundary.py tests/test_s1_identity_storage_isolation.py -q
      - name: Full regression
        run: python -m pytest -q
      - name: Dependency check
        run: pip check
