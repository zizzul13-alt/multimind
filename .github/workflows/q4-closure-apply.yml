name: Q4 Closure Apply
on:
  push:
    branches: [dna-q4-closure]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-q4-closure
      - name: Apply durable Q4 private-ready closure state
        shell: python
        run: |
          from pathlib import Path

          manifest = Path('docs/design-dna/quarantine/DNA_QUARANTINE_MANIFEST.yaml')
          text = manifest.read_text(encoding='utf-8')
          old = '''  Q4_private_repository_cut:\n    status: NOT_STARTED\n    strategy: MAKE_QUARANTINE_SELF_CONTAINED_AND_PROVE_PUBLIC_SAFE_FALLBACK_WITH_PRIVATE_PACKAGE_ABSENT'''
          new = '''  Q4_private_repository_cut:\n    status: DURABLE_CLOSED\n    accepted: true\n    integrated: true\n    integration_commit: 0cdbc62eb5819f7a65213e031657610f6dd4ca5a\n    pull_request: 88\n    acc_manifest: docs/design-dna/quarantine/Q4_ACC.yaml\n    extraction_inventory: docs/design-dna/quarantine/PRIVATE_EXTRACTION_INVENTORY.yaml\n    public_repo_private_ready: true\n    actual_private_repository_extraction_completed: false\n    strategy: MAKE_QUARANTINE_SELF_CONTAINED_AND_PROVE_PUBLIC_SAFE_FALLBACK_WITH_PRIVATE_PACKAGE_ABSENT\n    evidence:\n      clean_head: 37776_PASS_RUN_127\n      post_merge_exact_main: 37776_PASS_RUN_128\n      pip_check: CLEAN\n      public_safe_fallback: PASS\n      reverse_public_shim_imports: NONE\n      provider_core_database_pull: NONE'''
          if old not in text:
              raise SystemExit('missing Q4 manifest block')
          manifest.write_text(text.replace(old, new, 1), encoding='utf-8')

          inventory = Path('docs/design-dna/quarantine/PRIVATE_EXTRACTION_INVENTORY.yaml')
          text = inventory.read_text(encoding='utf-8')
          replacements = {
            'q4_state: PRIVATE_READY_CANDIDATE_AWAITING_GOVERNOR_ACC': 'q4_state: PRIVATE_READY',
            '  - Q4_ACC_NOT_YET_GRANTED_AT_CANDIDATE_AUTHORING\n': '',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing inventory pattern: {old!r}')
              text = text.replace(old, new, 1)
          inventory.write_text(text, encoding='utf-8')

          status = Path('docs/design-dna/migration/status/MIGRATION_STATUS.yaml')
          text = status.read_text(encoding='utf-8')
          replacements = {
            'authoritative_main_at_update: 40fd49967d9eebe289087d494174f1b13651df3f': 'authoritative_main_at_update: 0cdbc62eb5819f7a65213e031657610f6dd4ca5a',
            '  next_eligible_batch: M12_AFTER_Q4\n  quarantine_next_gate: Q4_PRIVATE_REPOSITORY_CUT': '  next_eligible_batch: M12\n  quarantine_next_gate: Q4_DURABLE_CLOSED_PRIVATE_READY',
            '''  Q4:\n    status: NOT_STARTED\n    required_before_batch: M12''': '''  Q4:\n    status: DURABLE_CLOSED\n    integration_commit: 0cdbc62eb5819f7a65213e031657610f6dd4ca5a\n    pull_request: 88\n    acc_manifest: docs/design-dna/quarantine/Q4_ACC.yaml\n    extraction_inventory: docs/design-dna/quarantine/PRIVATE_EXTRACTION_INVENTORY.yaml\n    clean_head_tests: 37776\n    clean_head_ci_run: 127\n    exact_main_tests: 37776\n    exact_main_ci_run: 128\n    private_ready: true\n    actual_private_extraction: false\n    required_before_batch: M12''',
            '''next_action:\n  gate: Q4_PRIVATE_REPOSITORY_CUT\n  then_gate: M12_FINAL_ASSET_POLICY_RECONCILIATION\n  authorized_by_user_sequence: true\n  instruction: EXECUTE_Q4_DURABLY_THEN_M12_WITHOUT_SKIPPING_PROOF''': '''next_action:\n  gate: M12_FINAL_ASSET_POLICY_RECONCILIATION\n  then_gate: STOP_BEFORE_PRIVATE_EXTRACTION_OR_RJ3\n  authorized_by_user_sequence: true\n  instruction: EXECUTE_M12_DURABLY_THEN_STOP_WITHOUT_STARTING_PRIVATE_EXTRACTION_OR_RJ3''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing migration status pattern: {old[:100]!r}')
              text = text.replace(old, new, 1)
          status.write_text(text, encoding='utf-8')

          test = Path('tests/test_design_dna_quarantine_boundary.py')
          text = test.read_text(encoding='utf-8')
          old = 'M11_ACC_PATH = "docs/design-dna/migration/status/M11_ACC.yaml"\nMIGRATION_STATUS_PATH'
          new = 'M11_ACC_PATH = "docs/design-dna/migration/status/M11_ACC.yaml"\nQ4_INTEGRATION_COMMIT = "0cdbc62eb5819f7a65213e031657610f6dd4ca5a"\nQ4_ACC_PATH = "docs/design-dna/quarantine/Q4_ACC.yaml"\nMIGRATION_STATUS_PATH'
          if old not in text:
              raise SystemExit('missing Q4 constant insertion seam')
          text = text.replace(old, new, 1)
          replacements = {
            'assert f"authoritative_main_at_update: {M11_INTEGRATION_COMMIT}" in text': 'assert f"authoritative_main_at_update: {Q4_INTEGRATION_COMMIT}" in text',
            'assert "next_eligible_batch: M12_AFTER_Q4" in text': 'assert "next_eligible_batch: M12" in text',
            'assert "quarantine_next_gate: Q4_PRIVATE_REPOSITORY_CUT" in text': 'assert "quarantine_next_gate: Q4_DURABLE_CLOSED_PRIVATE_READY" in text',
            'assert "gate: Q4_PRIVATE_REPOSITORY_CUT" in text': 'assert "Q4:\\n    status: DURABLE_CLOSED" in text\n    assert f"integration_commit: {Q4_INTEGRATION_COMMIT}" in text\n    assert f"acc_manifest: {Q4_ACC_PATH}" in text\n    assert "exact_main_tests: 37776" in text\n    assert "exact_main_ci_run: 128" in text\n    assert "private_ready: true" in text\n    assert "actual_private_extraction: false" in text\n    assert "gate: M12_FINAL_ASSET_POLICY_RECONCILIATION" in text',
            'assert "then_gate: M12_FINAL_ASSET_POLICY_RECONCILIATION" in text': 'assert "then_gate: STOP_BEFORE_PRIVATE_EXTRACTION_OR_RJ3" in text',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing lifecycle test pattern: {old!r}')
              text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')
      - name: Commit Q4 durable closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/design-dna/quarantine/DNA_QUARANTINE_MANIFEST.yaml docs/design-dna/quarantine/PRIVATE_EXTRACTION_INVENTORY.yaml docs/design-dna/migration/status/MIGRATION_STATUS.yaml tests/test_design_dna_quarantine_boundary.py
          git commit -m 'docs(dna): durably close Q4 private-ready gate'
          git push origin HEAD:dna-q4-closure
