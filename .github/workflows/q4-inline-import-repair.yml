name: Q4 Inline Import Repair
on:
  push:
    branches: [dna-q4-private-ready]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-q4-private-ready
      - name: Repair remaining function-local reverse shim import
        shell: python
        run: |
          from pathlib import Path
          path = Path('dna_quarantine/theme_studio/surface.py')
          text = path.read_text(encoding='utf-8')
          old = 'from ui.theme_studio.state import init_draft_from_composition'
          new = 'from dna_quarantine.theme_studio.state import init_draft_from_composition'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one residual import, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dna_quarantine/theme_studio/surface.py
          git commit -m 'fix(dna): remove final Q4 reverse shim import'
          git push origin HEAD:dna-q4-private-ready
