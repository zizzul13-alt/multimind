name: Design DNA M1 Targeted Verification

on:
  push:
    branches: [design-dna-m1-engines]

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: M1 targeted pytest
        run: python -m pytest tests/test_design_dna_m1_engines.py -q
      - name: M0 compatibility
        run: python -m pytest tests/test_design_dna_m0_runtime.py -q
      - name: Dependency sanity
        run: pip check
