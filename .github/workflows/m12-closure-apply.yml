name: M12 Closure Apply
on:
  push:
    branches: [dna-m12-closure]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dna-m12-closure
      - name: Apply final M12 durable closure state
        shell: python
        run: |
          from pathlib import Path

          status = Path('docs/design-dna/migration/status/MIGRATION_STATUS.yaml')
          text = status.read_text(encoding='utf-8')
          replacements = {
            'authoritative_main_at_update: 0cdbc62eb5819f7a65213e031657610f6dd4ca5a': 'authoritative_main_at_update: 145a948a5c3cbec76b9a9e008be18a57f285609a',
            '''  production_cutover: false\n  current_closed_batch: M11\n  next_eligible_batch: M12\n  quarantine_next_gate: Q4_DURABLE_CLOSED_PRIVATE_READY''': '''  production_cutover: false\n  dna_private_extraction_ready: true\n  actual_private_repository_extraction_completed: false\n  public_history_sanitized: false\n  rj3_started: false\n  current_closed_batch: M12\n  next_eligible_batch: PRIVATE_REPOSITORY_EXTRACTION\n  quarantine_next_gate: PRIVATE_REPOSITORY_EXTRACTION_READY''',
            '''  M12:\n    governor_status: NOT_STARTED\n    accepted: false\n    closed: false\n    integrated: false\n    scope_summary: ASSET_ENRICHMENT_AND_FINAL_271_ASSET_POLICY_RECONCILIATION\n    eq4_credit: 0''': '''  M12:\n    governor_status: ACC_CLOSED_INTEGRATED\n    accepted: true\n    closed: true\n    integrated: true\n    integration_commit: 145a948a5c3cbec76b9a9e008be18a57f285609a\n    pull_request: 90\n    manifest: docs/design-dna/migration/status/M12_ACC.yaml\n    implementation_report: docs/design-dna/migration/M12_IMPLEMENTATION_REPORT.md\n    canonical_runtime: design_dna/asset_policy.py\n    canonical_per_unit_ledger: docs/design-dna/migration/status/ASSET_POLICY_271.json\n    scope_summary: FINAL_271_ASSET_POLICY_RECONCILIATION\n    clean_head_tests: 37795\n    clean_head_ci_run: 135\n    exact_main_tests: 37795\n    exact_main_ci_run: 136\n    runtime_census_total: 271\n    asset_applicable: 207\n    asset_not_applicable: 64\n    direct_ip_gated: 75\n    final_approved: 0\n    m4_historical_semantics_rewritten: false\n    eq4_credit: 0''',
            '''next_action:\n  gate: M12_FINAL_ASSET_POLICY_RECONCILIATION\n  then_gate: STOP_BEFORE_PRIVATE_EXTRACTION_OR_RJ3\n  authorized_by_user_sequence: true\n  instruction: EXECUTE_M12_DURABLY_THEN_STOP_WITHOUT_STARTING_PRIVATE_EXTRACTION_OR_RJ3''': '''next_action:\n  gate: PRIVATE_REPOSITORY_EXTRACTION\n  then_gate: PUBLIC_HISTORY_SANITIZATION_DECISION_AFTER_EXTRACTION\n  authorized_by_user_sequence: false\n  instruction: STOP_AFTER_M12_DURABLE_CLOSURE__DO_NOT_START_PRIVATE_EXTRACTION_OR_RJ3_AUTOMATICALLY''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing migration status pattern: {old[:120]!r}')
              text = text.replace(old, new, 1)

          q4_anchor = '''    exact_main_tests: 37776\n    exact_main_ci_run: 128\n    private_ready: true'''
          q4_replacement = '''    exact_main_tests: 37776\n    exact_main_ci_run: 128\n    closure_commit: ac9c494e4fcac0c6fde8759a311f791efcae806e\n    closure_pull_request: 89\n    closure_exact_main_tests: 37776\n    closure_exact_main_ci_run: 134\n    private_ready: true'''
          if q4_anchor not in text:
              raise SystemExit('missing Q4 closure evidence insertion seam')
          text = text.replace(q4_anchor, q4_replacement, 1)
          status.write_text(text, encoding='utf-8')

          test = Path('tests/test_design_dna_quarantine_boundary.py')
          text = test.read_text(encoding='utf-8')
          old = 'Q4_ACC_PATH = "docs/design-dna/quarantine/Q4_ACC.yaml"\nMIGRATION_STATUS_PATH'
          new = 'Q4_ACC_PATH = "docs/design-dna/quarantine/Q4_ACC.yaml"\nM12_INTEGRATION_COMMIT = "145a948a5c3cbec76b9a9e008be18a57f285609a"\nM12_ACC_PATH = "docs/design-dna/migration/status/M12_ACC.yaml"\nMIGRATION_STATUS_PATH'
          if old not in text:
              raise SystemExit('missing M12 constant insertion seam')
          text = text.replace(old, new, 1)

          replacements = {
            'assert f"authoritative_main_at_update: {Q4_INTEGRATION_COMMIT}" in text': 'assert f"authoritative_main_at_update: {M12_INTEGRATION_COMMIT}" in text',
            'assert "current_closed_batch: M11" in text': 'assert "current_closed_batch: M12" in text',
            'assert "next_eligible_batch: M12" in text': 'assert "next_eligible_batch: PRIVATE_REPOSITORY_EXTRACTION" in text',
            'assert "quarantine_next_gate: Q4_DURABLE_CLOSED_PRIVATE_READY" in text': 'assert "quarantine_next_gate: PRIVATE_REPOSITORY_EXTRACTION_READY" in text',
            'assert "gate: M12_FINAL_ASSET_POLICY_RECONCILIATION" in text': '''assert "M12:\\n    governor_status: ACC_CLOSED_INTEGRATED" in text\n    assert f"integration_commit: {M12_INTEGRATION_COMMIT}" in text\n    assert f"manifest: {M12_ACC_PATH}" in text\n    assert "clean_head_tests: 37795" in text\n    assert "clean_head_ci_run: 135" in text\n    assert "exact_main_tests: 37795" in text\n    assert "exact_main_ci_run: 136" in text\n    assert "runtime_census_total: 271" in text\n    assert "asset_applicable: 207" in text\n    assert "asset_not_applicable: 64" in text\n    assert "direct_ip_gated: 75" in text\n    assert "final_approved: 0" in text\n    assert "m4_historical_semantics_rewritten: false" in text\n    assert "dna_private_extraction_ready: true" in text\n    assert "actual_private_repository_extraction_completed: false" in text\n    assert "public_history_sanitized: false" in text\n    assert "rj3_started: false" in text\n    assert "gate: PRIVATE_REPOSITORY_EXTRACTION" in text''',
            'assert "then_gate: STOP_BEFORE_PRIVATE_EXTRACTION_OR_RJ3" in text': 'assert "then_gate: PUBLIC_HISTORY_SANITIZATION_DECISION_AFTER_EXTRACTION" in text\n    assert "authorized_by_user_sequence: false" in text\n    assert "STOP_AFTER_M12_DURABLE_CLOSURE__DO_NOT_START_PRIVATE_EXTRACTION_OR_RJ3_AUTOMATICALLY" in text',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing lifecycle test pattern: {old!r}')
              text = text.replace(old, new, 1)

          append = '''\n\ndef test_m12_acc_and_inventory_lock_final_policy_without_extraction_overclaim():\n    acc = (ROOT / M12_ACC_PATH).read_text(encoding="utf-8")\n    assert "batch: M12" in acc\n    assert "governor_status: ACC_CLOSED_INTEGRATED" in acc\n    assert "accepted: true" in acc\n    assert "closed: true" in acc\n    assert "integrated: true" in acc\n    assert f"integration_commit: {M12_INTEGRATION_COMMIT}" in acc\n    assert "pull_request: 90" in acc\n    assert "total: 271" in acc\n    assert "applicable: 207" in acc\n    assert "not_applicable: 64" in acc\n    assert "gated_total: 75" in acc\n    assert "izzul: 36" in acc\n    assert "miko: 23" in acc\n    assert "track_t_i: 16" in acc\n    assert "asset_required_true: 0" in acc\n    assert "fallback_required_true: 271" in acc\n    assert "selected_asset_non_null: 0" in acc\n    assert "final_approved: 0" in acc\n    assert "m4_historical_semantics_rewritten: false" in acc\n    assert "ci_run: 135" in acc\n    assert "ci_run: 136" in acc\n    assert acc.count("passed: 37795") == 2\n    assert acc.count("pip_check: CLEAN") == 2\n    assert "eq4_credit: 0" in acc\n    assert "actual_private_repository_extraction_performed: false" in acc\n    assert "public_history_sanitized: false" in acc\n    assert "rj3_started: false" in acc\n    assert "production_cutover_performed: false" in acc\n    assert "next_gate: PRIVATE_REPOSITORY_EXTRACTION" in acc\n    assert "next_gate_authorized_by_this_manifest: false" in acc\n\n    inventory = (ROOT / "docs/design-dna/quarantine/PRIVATE_EXTRACTION_INVENTORY.yaml").read_text(encoding="utf-8")\n    assert "q4_state: PRIVATE_READY" in inventory\n    assert "m12_state: DURABLE_CLOSED" in inventory\n    assert "dna_private_extraction_ready: true" in inventory\n    assert "status: DURABLE_CLOSED" in inventory\n    assert "asset_applicable: 207" in inventory\n    assert "asset_not_applicable: 64" in inventory\n    assert "direct_ip_gated: 75" in inventory\n    assert "final_approved: 0" in inventory\n    assert "actual_private_repository_extraction_completed: false" in inventory\n    assert "public_history_sanitized: false" in inventory\n    assert "EQ4_NOT_GRANTED" in inventory\n    assert "RJ3_NOT_STARTED" in inventory\n    assert "PRODUCTION_CUTOVER_NOT_AUTHORIZED" in inventory\n'''
          if 'def test_m12_acc_and_inventory_lock_final_policy_without_extraction_overclaim()' in text:
              raise SystemExit('M12 final closure test already present unexpectedly')
          test.write_text(text.rstrip() + append, encoding='utf-8')
      - name: Commit final M12 closure state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/design-dna/migration/status/MIGRATION_STATUS.yaml tests/test_design_dna_quarantine_boundary.py
          git commit -m 'docs(dna): durably close M12 migration state'
          git push origin HEAD:dna-m12-closure
